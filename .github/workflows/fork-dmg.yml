name: Build DMG (fork)

# Mirrors the original repository's build.yml triggers (push to main on
# source changes) plus workflow_dispatch for on-demand DMG builds.
on:
  push:
    branches: [ main ]
    paths:
      - 'Sources/**'
      - 'Fluid.xcodeproj/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'Info.plist'
      - 'Fluid.entitlements'
      - 'build.sh'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    name: Build unsigned app + DMG
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build unsigned app
        run: |
          set -o pipefail
          FLUIDVOICE_CONFIGURATION=Release ./build.sh unsigned 2>&1 | tail -40

      - name: Create DMG
        run: |
          APP="DerivedData/Build/Products/Release/FluidVoice.app"
          test -d "$APP" || { echo "app not found"; exit 1; }
          hdiutil create \
            -volname FluidVoice \
            -srcfolder "$APP" \
            -ov \
            -format UDZO \
            FluidVoice.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluidVoice-dmg
          path: FluidVoice.dmg
          if-no-files-found: error
